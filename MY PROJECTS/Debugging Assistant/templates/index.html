<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Code Debugging Assistant</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0f172a;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADING */
        h1 {
            margin-top: 60px;
            text-align: center;
            font-size: 40px;
            color: #e2e8f0;
            font-family: 'Cinzel', serif;
        }

        /* CODE BOX */
        .code-container {
            margin-top: 40px;
            width: 600px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 200px;

            padding: 15px;
            padding-bottom: 60px;

            font-size: 16px;

            border-radius: 10px;
            border: none;
            outline: none;

            background: white;
            color: black;

            resize: none;
        }

        /* CHECK BUTTON */
        .check-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;

            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;

            background: #d1d5db;
            color: black;

            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* OUTPUT */
        .output {
            margin-top: 20px;
            width: 700px;
            font-size: 18px;
            line-height: 1.6;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
        }

        .correct {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>INTELLIGENT CODE DEBUGGING ASSISTANT</h1>

<div class="code-container">
    <textarea id="codeInput" placeholder="Enter the Python code..."></textarea>
    <button class="check-btn" onclick="checkCode()">Check</button>
</div>

<div class="output" id="output"></div>

<script>

function checkCode() {

    const input = document.getElementById("codeInput").value;
    const output = document.getElementById("output");

    output.innerHTML = "";

    if (input.trim() === "") {
        return;
    }

    fetch("/check_code", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code: input })
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "success") {
            output.innerHTML = `
                <div class="correct">
                    You have entered the code correctly. Keep going 😊
                </div>
            `;
        } else {
            output.innerHTML = `
                <div class="error">
                    Error: ${data.error}
                </div>
                <div class="correct">
                    Suggestion: ${data.suggestion}
                </div>
                <div style="
                    color: #7c3aed;
                    margin-top: 20px;
                    font-weight: 600;
                    font-size: 19px;
                ">
                    Fix the error and press the check button to check your code again.
                </div>
            `;
        }
    })
    .catch(() => {
        output.innerHTML = `
            <div class="error">
                Server error. Please try again.
            </div>
        `;
    });
}

</script>

</body>
</html>
