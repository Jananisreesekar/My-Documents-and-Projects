<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Code Debugging Assistant</title>

    <!-- Princeton Style Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to right, #cbd5e1, #94a3b8);

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .title {
            text-align: center;
        }

        .line {
            font-size: 70px;
            font-weight: 900;
            letter-spacing: 6px;

            /* background: linear-gradient(45deg, #1e3a8a, #7c3aed);
            background-clip: text; */
            color: #6d032f;
        }

        /* 🔥 EACH WORD ANIMATION */
        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease;
            margin-right: 25px;
        }

        .show {
            opacity: 1;
            transform: translateY(0);
        }

        .emoji {
            font-size: 70px;
            left:55%;
            top:70%;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 1s ease;
        }
    </style>
</head>

<body>

<div class="title">
    <div class="line" id="line1"></div>
    <div class="line" id="line2"></div>
    <div class="emoji" id="emoji">💻</div>
</div>

<script>
    const words = [
        "INTELLIGENT",
        "CODE",
        "DEBUGGING",
        "ASSISTANT"
    ];

    const line1 = document.getElementById("line1");
    const line2 = document.getElementById("line2");
    const emoji = document.getElementById("emoji");

    let index = 0;

    function showWords() {

        let span = document.createElement("span");
        span.classList.add("word");
        span.innerText = words[index];

        if (index < 2) {
            line1.appendChild(span);
        } else {
            line2.appendChild(span);
        }

        // 🔥 apply animation
        setTimeout(() => {
            span.classList.add("show");
        }, 100);

        index++;

        if (index < words.length) {
            setTimeout(showWords, 2000);
        } else {

            // show emoji
            setTimeout(() => {
                emoji.style.opacity = "1";
            }, 1000);

            // redirect
            setTimeout(() => {
                window.location.href = "/intro";
            }, 5000);
        }
    }

    showWords();
</script>

</body>
</html>
