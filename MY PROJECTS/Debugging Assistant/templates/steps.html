<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Code Debugging Assistant</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to right, #cbd5e1, #94a3b8);
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* 🔥 ABOUT HEADING */
        h1 {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 48px;
            color: #0a3fee;
            font-family: 'Berkshire Swash', cursive;

            opacity: 0;
            transform: translateY(40px);
            transition: all 1.5s ease;
        }

        .show-heading {
            opacity: 1;
            transform: translateY(0);
        }

        /* CLOUD */
        .cloud-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            transition: opacity 1.5s ease;
        }

        .cloud-container img {
            width: 100%;
        }

        /* STEP TEXT */
        .step {
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: 600;
            color: #8a461e;
            text-align: center;
            line-height: 1.6;
        }

        /* FINAL SCREEN */
        #projectScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* FINAL BUTTON */
        #projectScreen button {
            padding: 20px 120px;
            font-size: 24px;
            font-weight: bold;

            background: #10ee09;
            color: #3f0596;

            border: none;
            border-radius: 40px;
            cursor: pointer;

            opacity: 0;
            transform: translateY(30px);
            transition: 1.5s ease;
        }

        .arrow {
            margin-left: 10px;
            font-size: 22px;
        }

        .show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

    </style>
</head>

<body>

<h1>About This App 📖</h1>

<div class="cloud-container" id="cloud">
    <img src="/static/cloud.png">
    <div class="step" id="stepText"></div>
</div>

<!-- FINAL SCREEN -->
<div id="projectScreen">
    <button id="finalBtn" onclick="goToMain()">
        Let's Begin <span class="arrow">➜</span>
    </button>
</div>

<script>

let step = 0;

const steps = [
    "A beginner friendly app",
    "Helps to fix the basic errors",
    "Gives the suggestions to fix the errors",
    "Improves your coding skills"
];

const stepText = document.getElementById("stepText");

function showSteps() {

    if (step < steps.length) {

        stepText.innerHTML = `<span>${steps[step]}</span>`;
        step++;

        setTimeout(showSteps, 3500);

    } else {

        setTimeout(() => {

            // 🔥 Fade out heading + cloud
            document.querySelector("h1").style.opacity = "0";
            document.getElementById("cloud").style.opacity = "0";

            setTimeout(() => {

                document.getElementById("projectScreen").style.display = "block";

                // 🔥 Smooth sequence animation

                setTimeout(() => {
                    document.getElementById("finalBtn").classList.add("show");
                }, 1200);

            }, 1500);

        }, 3000);
    }
}

window.onload = () => {

    // 🔥 Animate heading smoothly
    setTimeout(() => {
        document.querySelector("h1").classList.add("show-heading");
    }, 300);

    // Start steps after heading appears
    setTimeout(() => {
        showSteps();
    }, 3000);
};

function goToMain() {
    window.location.href = "/main";
}

</script>

</body>
</html>
