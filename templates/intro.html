<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Code Debugging Assistant</title>

    <!-- Script Style Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right,  #cbd5e1, #94a3b8);
            overflow: hidden;
        }

        h1 {
            text-align: center;
        }

        /* Stylish Script Text */
        #text {
            font-family: 'Great Vibes', cursive;
            font-size: 100px;
            color: #f52e2e; /* deep blue (no lavender) */
            letter-spacing: 5px;
        }

        /* Emoji normal */
        #emoji {
            font-size: 70px;
            margin-left: 10px;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>

<body>

<h1>
    <span id="text"></span>
    <span id="emoji"></span>
</h1>

<script>
    const text = "Welcome"; // better in script font (not full caps)
    let i = 0;

    function typeEffect() {
        if (i < text.length) {
            document.getElementById("text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeEffect, 200);
        } else {
            // Add emoji
            document.getElementById("emoji").innerHTML = " 😊";

            // Stay visible
            setTimeout(() => {
                document.querySelector("h1").classList.add("fade-out");

                setTimeout(() => {
                    window.location.href = "/steps";
                }, 1500);

            }, 5000);
        }
    }

    typeEffect();
</script>

</body>
</html>
